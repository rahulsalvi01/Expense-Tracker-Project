<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Page Header -->
        <div class="text-center mb-5">
            <h1 class="fw-bold">Personal Expense Tracker</h1>
            <p class="text-muted mb-0">Keep track of your spending in a simple and organized way.</p>
        </div>

        <!-- Main Content -->
        <div class="row g-4 justify-content-center">

            <!-- Expense Form -->
            <div class="col-lg-7">
                <div class="card expense-card h-100">
                    <div class="card-body p-4">
                        <h4 class="card-title mb-4">Add Expense</h4>

                        <form method="post" action="#">
                            <div class="mb-3">
                                <label for="expenseName" class="form-label">Expense Name</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="expenseName"
                                    name="expense_name"
                                    placeholder="e.g. Grocery Shopping"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="amount" class="form-label">Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input
                                        type="number"
                                        class="form-control"
                                        id="amount"
                                        name="amount"
                                        placeholder="0.00"
                                        min="0"
                                        step="0.01"
                                        required
                                    >
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="" selected disabled>Select a category</option>
                                    <option>Food</option>
                                    <option>Transport</option>
                                    <option>Shopping</option>
                                    <option>Entertainment</option>
                                    <option>Bills</option>
                                    <option>Education</option>
                                    <option>Health</option>
                                    <option>Other</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Add Expense</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Total Spent Summary -->
            <div class="col-lg-5">
                <div class="card summary-card h-100">
                    <div class="card-body p-4 text-center">
                        <p class="summary-label mb-2">Total Spent</p>
                        <h2 class="total-spent mb-3">₹0.00</h2>
                        <p class="text-muted mb-0">Your total expense amount will appear here.</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <div class="text-center mt-5">
            <p class="text-muted mb-0">Simple. Clean. Easy to manage.</p>
        </div>

    </div>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
